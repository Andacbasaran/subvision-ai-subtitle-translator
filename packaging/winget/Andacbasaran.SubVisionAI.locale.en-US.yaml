ShortDescription: Real-time, 100% offline English-to-Turkish on-screen & live-audio subtitle translator studio.
Description: >-
  SubVision AI reads English subtitles in real time from PC games, movies, TV shows,
  and live streams using RapidOCR (ONNX CPU) and translates them into Turkish completely
  offline via CTranslate2 INT8 (~88 ms latency, 0 MB VRAM) onto a click-through overlay.
  Includes optional context-aware translation backends and live audio (Whisper) support.
