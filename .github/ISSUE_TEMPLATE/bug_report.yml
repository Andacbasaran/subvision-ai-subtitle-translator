name: Bug Report
description: Report a crash, OCR miss, translation issue, or UI bug.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open game / video player (...)
        2. Select ROI with F7
        3. Start translation with F8
        4. Observe error...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SubVision AI Version
      placeholder: "e.g. v1.4.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS (Apple Silicon)
        - macOS (Intel)
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: OCR / Input Mode
      options:
        - Screen OCR (fast_mask)
        - Screen OCR (hybrid)
        - Screen OCR (full_ocr)
        - Live Audio (Whisper)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash Log / Terminal Output (if any)
      description: Attach relevant lines from `crash.log` or terminal output.
      render: text
