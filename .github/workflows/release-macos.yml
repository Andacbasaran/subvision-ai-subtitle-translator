name: Build macOS Release (Apple Silicon)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm etiketi (örn: 1.5.0)"
        required: false
        default: "1.5.0"

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS Apple Silicon (arm64) DMG
    runs-on: macos-14
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Determine release version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${{ github.ref_name }}"
            VER="${VER#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
            VER="${VER#v}"
          else
            VER="1.5.0"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Derlenecek macOS sürümü: $VER"

      - name: Install dependencies and PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt pyinstaller

      - name: Syntax check & automated test suite
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m py_compile hardware.py glossary.py translator.py ocr_engine.py overlay_ui.py main.py benchmark.py build_macos.py test_pipeline.py
          python -m unittest test_pipeline -v

      - name: Build SubVision AI.app & Apple Silicon DMG
        shell: bash
        run: |
          python build_macos.py --version "${{ steps.meta.outputs.version }}" --arch arm64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SubVisionAI-macOS-arm64-v${{ steps.meta.outputs.version }}
          path: |
            dist/SubVisionAI-v${{ steps.meta.outputs.version }}-macOS-arm64.dmg
            dist/SHA256SUMS-macOS.txt
          retention-days: 30

      - name: Publish GitHub Release assets (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/SubVisionAI-v${{ steps.meta.outputs.version }}-macOS-arm64.dmg
            dist/SHA256SUMS-macOS.txt
