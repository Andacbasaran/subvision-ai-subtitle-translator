name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm etiketi (örn: 1.3.0)"
        required: false
        default: "1.3.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Installer & Portable Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Determine release version
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          } elseif ("${{ inputs.version }}" -ne "") {
            $ver = "${{ inputs.version }}".TrimStart("v")
          } else {
            $ver = "1.3.0"
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "Derlenecek sürüm: $ver"

      - name: Install dependencies and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt pyinstaller

      - name: Syntax check & automated test suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m py_compile hardware.py glossary.py translator.py ocr_engine.py overlay_ui.py main.py benchmark.py build_exe.py test_pipeline.py
          python -m unittest test_pipeline -v

      - name: Build lightweight GUI Setup Wizard (SubVisionAI.exe)
        shell: pwsh
        run: |
          python build_exe.py

      - name: Build standalone PyInstaller --onedir bundle
        shell: pwsh
        run: |
          python build_exe.py --only-pyinstaller

      - name: Build Inno Setup Windows Installer (.exe)
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $defaultIscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $defaultIscc) {
              $isccPath = $defaultIscc
            } else {
              choco install innosetup -y --no-progress
              $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            }
          } else {
            $isccPath = $iscc.Source
          }
          & $isccPath "/DMyAppVersion=${{ steps.meta.outputs.version }}" installer.iss

      - name: Package Portable ZIP and SHA256SUMS.txt
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          New-Item -ItemType Directory -Force -Path release_out | Out-Null

          $setupExe = "dist\SubVisionAI-Setup-v$ver-Windows-x64.exe"
          Copy-Item $setupExe "release_out\"

          $portableZip = "release_out\SubVisionAI-Portable-v$ver-Windows-x64.zip"
          Compress-Archive -Path "dist\SubVisionAI\*" -DestinationPath $portableZip -CompressionLevel Optimal

          Copy-Item "SubVisionAI.exe" "release_out\SubVisionAI-OnlineSetup-v$ver.exe"

          Push-Location release_out
          $hashes = Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $hashes | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii
          Get-Content "SHA256SUMS.txt"
          Pop-Location

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SubVisionAI-Windows-v${{ steps.meta.outputs.version }}
          path: release_out/*
          retention-days: 30

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release_out/SubVisionAI-Setup-v${{ steps.meta.outputs.version }}-Windows-x64.exe
            release_out/SubVisionAI-Portable-v${{ steps.meta.outputs.version }}-Windows-x64.zip
            release_out/SubVisionAI-OnlineSetup-v${{ steps.meta.outputs.version }}.exe
            release_out/SHA256SUMS.txt
