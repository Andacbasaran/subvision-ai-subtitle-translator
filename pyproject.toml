[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subvision-ai"
version = "1.5.0"
description = "Ultra-low-latency, 100% offline real-time on-screen & live-audio English-to-Turkish subtitle translator studio."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Andac Basaran" }
]
keywords = [
    "subtitle",
    "translator",
    "ocr",
    "ctranslate2",
    "rapidocr",
    "whisper",
    "turkish",
    "gaming",
    "overlay",
    "pyqt6",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "PyQt6>=6.6.0",
    "mss>=9.0.1",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "rapidocr-onnxruntime>=1.3.24",
    "ctranslate2>=4.3.0",
    "sentencepiece>=0.2.0",
]

[project.optional-dependencies]
audio = [
    "faster-whisper>=1.0.3",
    "sounddevice>=0.4.6",
]
audio-windows = [
    "faster-whisper>=1.0.3",
    "pyaudiowpatch>=0.2.12.6",
]
dev = [
    "ruff>=0.6.0",
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://subvisionai.andacbasaran.com/"
Repository = "https://github.com/Andacbasaran/subvision-ai-subtitle-translator"
Issues = "https://github.com/Andacbasaran/subvision-ai-subtitle-translator/issues"
Changelog = "https://github.com/Andacbasaran/subvision-ai-subtitle-translator/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["subvision*"]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [
    ".venv",
    "build",
    "dist",
    "models",
    "website",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]
